<main class="contact">
  <!-- Sayfa başlığı -->
  <h1>İletişim</h1>

  <form id="contactForm" action="https://formspree.io/f/xbdykgoa" method="POST" novalidate>
  <!-- opsiyonel ama iyi: spam için -->
  <input type="text" name="_gotcha" style="display:none">

  <input id="name" name="name" type="text" placeholder="İsminiz" required>
  <span id="errName"></span>

  <input id="email" name="email" type="email" placeholder="E-posta adresiniz" required>
  <span id="errEmail"></span>

  <textarea id="message" name="message" rows="5" placeholder="Mesajınız" required></textarea>
  <span id="errMsg"></span>

  <button id="sendBtn" type="submit">Gönder</button>
  <p id="formOk"></p>
</form>

</main>
